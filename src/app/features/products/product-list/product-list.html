<section class="products-page">
  <h2>Produtos</h2>

  <div class="products-grid" *ngIf="products$ | async as products">
    <div class="product-card" *ngFor="let product of products">
      <img [src]="product.image" [alt]="product.name">
      <h3>{{ product.name }}</h3>
      <p>{{ product.price }} €</p>
    </div>
  </div>
</section>
